# DEMO / FIXTURE overlay — explicitly selects the bundled fake NARU. Never part of the integrated run.
#   docker compose -f docker-compose.yml -f docker-compose.fake.yml up -d --build
# Use a separate stack id so fake history never shares volumes with the real NARU profile:
#   $env:TWIN_STACK_ID='naruprof-fake'; docker compose -p naruprof-fake -f docker-compose.yml -f docker-compose.fake.yml up -d
#
#   fake-naru : deterministic LearningProjection publisher (gRPC 9092, control HTTP 9093)
#   console   : browser test console on http://127.0.0.1:8088 (renders tokens; loopback only)

services:
  fake-naru:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: fake-naru
    image: naruprof/fake-naru:1.0.0
    restart: unless-stopped
    environment:
      NARUPROF_PROFILE_ID: ${NARUPROF_PROFILE_ID:-f7933216-20db-49cb-90e0-3a9d5396966d}
      TWIN_TO_NARU_TOKEN: ${TWIN_TO_NARU_TOKEN:-test-only-twin-to-naru-token-00001}
      FAKE_NARU_BIND_ADDRESS: 0.0.0.0
      FAKE_NARU_TRACE: common          # revisions 0..3 of the contract trace ("empty" = revision 0 only)
    ports:
      - "${FAKE_NARU_PUBLISH_ADDRESS:-127.0.0.1}:9092:9092"   # gRPC LearningProjection
      - "${FAKE_NARU_PUBLISH_ADDRESS:-127.0.0.1}:9093:9093"   # control: GET /head, POST /commit /delete /rewind /available
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9093/head"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 256m } } }

  twin:
    depends_on:
      fake-naru: { condition: service_healthy }
    environment:
      TWIN_SOURCE_MODE: fake
      NARU_GRPC_TARGET: fake-naru:9092
      NARUPROF_PROFILE_ID: ${NARUPROF_PROFILE_ID:-f7933216-20db-49cb-90e0-3a9d5396966d}
      TWIN_TO_NARU_TOKEN: ${TWIN_TO_NARU_TOKEN:-test-only-twin-to-naru-token-00001}
      VERTX_TO_TWIN_TOKEN: ${VERTX_TO_TWIN_TOKEN:-test-only-vertx-to-twin-token-0001}
      TWIN_MAINTENANCE_TOKEN: ${TWIN_MAINTENANCE_TOKEN:-test-only-twin-maintenance-token-01}

  console:
    image: docker.io/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on: [twin, fake-naru, nginx]
    environment:                       # same values as the twin, rendered into /config.js
      NARUPROF_PROFILE_ID: ${NARUPROF_PROFILE_ID:-f7933216-20db-49cb-90e0-3a9d5396966d}
      VERTX_TO_TWIN_TOKEN: ${VERTX_TO_TWIN_TOKEN:-test-only-vertx-to-twin-token-0001}
      TWIN_MAINTENANCE_TOKEN: ${TWIN_MAINTENANCE_TOKEN:-test-only-twin-maintenance-token-01}
    volumes:
      - ./deploy/console/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/console/index.html:/usr/share/nginx/html/index.html:ro
      - ./deploy/console/console-config.conf.template:/etc/nginx/templates/console-config.conf.template:ro
    ports:
      - "127.0.0.1:8088:80"            # loopback only: the page carries role tokens
    deploy: { resources: { limits: { memory: 32m } } }
