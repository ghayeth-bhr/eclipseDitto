# Test console: serves index.html and proxies same-origin API calls to the stack, so the browser
# needs no CORS. Dev/demo only, bound to 127.0.0.1 by docker-compose.yml.
worker_processes 1;
events { worker_connections 128; }

http {
  include /etc/nginx/mime.types;
  server_tokens off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;

  server {
    listen 80;
    root /usr/share/nginx/html;

    location = / { try_files /index.html =404; add_header Cache-Control no-store; }

    # /config.js with the profile id and tokens from .env (rendered from console-config.conf.template)
    include /etc/nginx/conf.d/console-config.conf;

    # twin service (private summary API, health, status)
    location /twin/ {
      set $up twin:8083;
      rewrite ^/twin/(.*)$ /$1 break;
      proxy_pass http://$up;
      proxy_set_header Host twin;
    }

    # Ditto through its authenticating nginx front (the browser sends Basic auth itself)
    location /ditto/ {
      set $up nginx:80;
      rewrite ^/ditto/(.*)$ /$1 break;
      proxy_pass http://$up;
      proxy_set_header Host ditto;
      proxy_hide_header WWW-Authenticate;   # avoid the browser's native login popup on 401
    }

    # fake NARU control API
    location /naru/ {
      set $up fake-naru:9093;
      rewrite ^/naru/(.*)$ /$1 break;
      proxy_pass http://$up;
    }
  }
}
