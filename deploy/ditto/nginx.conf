# naruprof-eclipseDitto: authenticating front for the private Ditto gateway.
# Derived from eclipse-ditto/ditto deployment/docker/nginx.conf at tag 3.9.8.
#
# * HTTP Basic auth against nginx.htpasswd; the authenticated user becomes the Ditto subject
#   "nginx:<user>" via x-ditto-pre-authenticated. proxy_set_header REPLACES any caller-supplied
#   value, so a client cannot choose its own subject.
# * Only the persisted twin API surfaces the twin service needs are exposed:
#   /api/2/things/*, /api/2/policies/*, /api/2/whoami. Everything else (search, connections,
#   messages via /inbox|/outbox, websockets, devops, UI) answers 404 here.
# * The upstream is resolved per request through Docker DNS so a restarted gateway is found again.

worker_processes 1;
events { worker_connections 256; }

http {
  default_type application/json;
  server_tokens off;
  charset utf-8;
  merge_slashes off;
  client_max_body_size 256k;

  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  resolver 127.0.0.11 valid=5s ipv6=off;

  log_format twin '$remote_addr $remote_user [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout twin;

  server {
    listen 80;
    server_name _;
    set $ditto_gateway http://gateway:8080;

    location = /nginx-health { auth_basic off; return 200 '{"status":"ok"}'; }

    # live messages / inbox / outbox are never needed by the projection
    location ~ ^/api/2/things/[^/]+/(inbox|outbox) { return 404 '{"status":404,"error":"naruprof.notexposed"}'; }

    location ~ ^/api/2/(things|policies)(/|$) {
      auth_basic "naruprof-ditto";
      auth_basic_user_file nginx.htpasswd;
      proxy_pass $ditto_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization "";
      proxy_set_header x-ditto-pre-authenticated "nginx:${remote_user}";
      proxy_set_header Connection "";
      proxy_buffering off;
    }

    location = /api/2/whoami {
      auth_basic "naruprof-ditto";
      auth_basic_user_file nginx.htpasswd;
      proxy_pass $ditto_gateway;
      proxy_http_version 1.1;
      proxy_set_header Authorization "";
      proxy_set_header x-ditto-pre-authenticated "nginx:${remote_user}";
      proxy_set_header Connection "";
    }

    location / { return 404 '{"status":404,"error":"naruprof.notexposed"}'; }
  }
}
