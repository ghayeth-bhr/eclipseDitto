# naruprof-eclipseDitto — pinned private Eclipse Ditto stack (persisted twin API only).
#
# Derived from eclipse-ditto/ditto deployment/docker/docker-compose.yml at tag 3.9.8.
# Changes against upstream (see docs/ditto-deployment.md):
#   * images pinned by tag AND digest (see versions.properties);
#   * only mongodb, policies, things, gateway and nginx: search, connectivity, UI and swagger
#     are deliberately absent (not needed for the v1 read path);
#   * mongodb and gateway publish NO host ports; nginx is bound to 127.0.0.1 only;
#   * mongodb data lives on the named volume "naruprof_ditto_mongo" (persistent);
#   * entity creation is restricted to namespace naruprof.learning: only the operator subject
#     may create policies, only the projector subject may create things;
#   * the devops/status password is a test-only value injected from the environment.
#
# Start:   docker compose -p naruprof-ditto up -d
# Stop:    docker compose -p naruprof-ditto stop
# Wipe:    docker compose -p naruprof-ditto down -v     (destroys the twin store; rebuildable)

name: naruprof-ditto

x-ditto-java-opts: &ditto-java-opts >-
  -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport
  -XX:+UseStringDeduplication -Xss512k -XX:MaxRAMPercentage=50 -XX:+UseG1GC -XX:MaxGCPauseMillis=150
  -Dpekko.coordinated-shutdown.exit-jvm=on
  -Dpekko.cluster.shutdown-after-unsuccessful-join-seed-nodes=180s
  -Dpekko.cluster.failure-detector.threshold=15.0
  -Dpekko.cluster.failure-detector.expected-response-after=10s
  -Dpekko.cluster.failure-detector.acceptable-heartbeat-pause=20s
  -Dpekko.cluster.downing-provider-class=
  -Dditto.entity-creation.grant.0.resource-types.0=policy
  -Dditto.entity-creation.grant.0.namespaces.0=naruprof.learning
  -Dditto.entity-creation.grant.0.auth-subjects.0=nginx:naruprof-twin-operator
  -Dditto.entity-creation.grant.1.resource-types.0=thing
  -Dditto.entity-creation.grant.1.namespaces.0=naruprof.learning
  -Dditto.entity-creation.grant.1.auth-subjects.0=nginx:naruprof-twin-projector

services:
  mongodb:
    image: docker.io/mongo:7.0@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1
    deploy: { resources: { limits: { memory: 384m } } }
    restart: unless-stopped
    command: mongod --storageEngine wiredTiger --noscripting
    user: mongodb
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: { options: { max-size: 20m } }

  policies:
    image: docker.io/eclipse/ditto-policies:3.9.8@sha256:c20a9fa82025988bd591f843ba22c5a2f2943a67b0abb515d2669037337eaf25
    deploy: { resources: { limits: { memory: 512m } } }
    restart: unless-stopped
    networks: { default: { aliases: [ditto-cluster] } }
    depends_on: { mongodb: { condition: service_healthy } }
    environment:
      TZ: UTC
      BIND_HOSTNAME: 0.0.0.0
      MONGO_DB_HOSTNAME: mongodb
      JAVA_TOOL_OPTIONS: *ditto-java-opts
    healthcheck: &ditto-health
      test: curl --fail `hostname`:7626/alive || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    logging: { options: { max-size: 20m } }

  things:
    image: docker.io/eclipse/ditto-things:3.9.8@sha256:98a1c309ae6dc43e75651921f02d82502b702b50971c650acfc708b43e580a15
    deploy: { resources: { limits: { memory: 512m } } }
    restart: unless-stopped
    networks: { default: { aliases: [ditto-cluster] } }
    depends_on: { mongodb: { condition: service_healthy } }
    environment:
      TZ: UTC
      BIND_HOSTNAME: 0.0.0.0
      MONGO_DB_HOSTNAME: mongodb
      JAVA_TOOL_OPTIONS: *ditto-java-opts
    healthcheck: *ditto-health
    logging: { options: { max-size: 20m } }

  gateway:
    image: docker.io/eclipse/ditto-gateway:3.9.8@sha256:63df18fb0058c06ac684ebc844826b2537f7ff1f2db92575f5e3e60045ab2c1c
    deploy: { resources: { limits: { memory: 512m } } }
    restart: unless-stopped
    networks: { default: { aliases: [ditto-cluster] } }
    depends_on: [policies, things]
    # no "ports": the gateway trusts x-ditto-pre-authenticated and must only be reachable via nginx
    environment:
      TZ: UTC
      BIND_HOSTNAME: 0.0.0.0
      ENABLE_PRE_AUTHENTICATION: "true"
      DEVOPS_PASSWORD: ${DITTO_DEVOPS_PASSWORD:-test-only-devops-secret}
      STATUS_PASSWORD: ${DITTO_STATUS_PASSWORD:-test-only-status-secret}
      JAVA_TOOL_OPTIONS: *ditto-java-opts
    healthcheck: *ditto-health
    logging: { options: { max-size: 20m } }

  nginx:
    image: docker.io/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    deploy: { resources: { limits: { memory: 32m } } }
    restart: unless-stopped
    depends_on: [gateway]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.htpasswd:/etc/nginx/nginx.htpasswd:ro
    ports:
      - "127.0.0.1:${DITTO_HTTP_PORT:-8090}:80"
    logging: { options: { max-size: 10m } }

volumes:
  mongo-data:
    name: naruprof_ditto_mongo
